name: Validate monitoring automation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  config-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test generated configuration without touching the host
        run: python -m unittest discover -s tests -v
      - name: Check Linux legacy script syntax
        if: runner.os == 'Linux'
        run: bash -n Script_instalacaoagenteZabbixUbuntu_Debian.sh
      - name: Parse Windows legacy script without executing it
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'Script_instalacaoagenteZabbixWindows.ps1'),
            [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
